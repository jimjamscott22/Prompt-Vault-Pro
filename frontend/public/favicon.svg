  <line x1="18" y1="52" x2="82" y2="52" stroke="#d97706" stroke-width="3" opacity="0.4"/>
  <line x1="27" y1="29" x2="73" y2="75" stroke="#d97706" stroke-width="3" opacity="0.4"/>
  <line x1="73" y1="29" x2="27" y2="75" stroke="#d97706" stroke-width="3" opacity="0.4"/>
